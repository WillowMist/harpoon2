[supervisord]
nodaemon=true
logfile=/var/log/harpoon2/supervisord.log
pidfile=/var/run/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:celery-worker]
# --max-tasks-per-child=10 auto-recycles each worker fork after 10 tasks.
# Prevents the connection-pool accumulation that starved gunicorn after
# ~50 min of recovery-loop churn (each transfer_files_async fork held a
# Postgres connection; without recycling, dozens of forks piled up and
# the healthcheck started timing out at 5s).
#
# --concurrency=4 bounds the fork count to match the Postgres pool math
# (Phase 5): 4 worker forks + 6 gunicorn (3 workers x 2 threads) + ~2
# transient = 12 of 100 connections, leaving headroom. NOT the default
# CPU-bound value — capping at 4 protects against auto-scaling surprises
# on bigger hosts. Operator can dial back to --concurrency=2 if the PG
# pool is smaller.
#
# --prefetch-multiplier=1 is belt-and-braces; already the default via
# harpoon2/celery.py worker_prefetch_multiplier=1.
command=celery -A harpoon2 worker -l debug --concurrency=4 --prefetch-multiplier=1 --max-tasks-per-child=10
directory=/opt/harpoon2
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=10
stdout_logfile=/var/log/harpoon2/celery-worker.log
stderr_logfile=/var/log/harpoon2/celery-worker.log
environment=PYTHONUNBUFFERED=1

[program:celery-beat]
command=celery -A harpoon2 beat -l info --schedule=/data/celerybeat-schedule
directory=/opt/harpoon2
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=10
stdout_logfile=/var/log/harpoon2/celery-beat.log
stderr_logfile=/var/log/harpoon2/celery-beat.log
environment=PYTHONUNBUFFERED=1

[program:celery-watchdog]
# The watchdog must NOT share the main worker pool: when the pool is saturated
# with hung transfer_files_async tasks, a watchdog task queued on the same pool
# sits behind them and never executes — a smoke alarm with no sprinkler. This
# dedicated single-slot worker consumes only the celery.watchdog queue (routed
# in harpoon2/celery.py), so it always has a free slot to run the self-healing
# check even while the main pool is fully wedged.
command=celery -A harpoon2 worker -l info --concurrency=1 --queues=celery.watchdog -n celery@watchdog@%%h
directory=/opt/harpoon2
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=10
stdout_logfile=/var/log/harpoon2/celery-watchdog.log
stderr_logfile=/var/log/harpoon2/celery-watchdog.log
environment=PYTHONUNBUFFERED=1

[program:django]
# Was: python3 manage.py runserver 0.0.0.0:4277
# runserver is the Django dev server — threaded, no worker cap, no request
# timeout, no connection cap. With api_dashboard polling every 3s and
# CONN_MAX_AGE=0 (now 60s via settings_template.py), bursts of concurrent
# requests would stack up unbounded threads, each holding a Postgres
# connection. A past pool exhaustion was downstream of this.
#
# gunicorn gives us bounded workers + threads, a real request timeout, and
# pairs cleanly with CONN_MAX_AGE=60 so connection reuse actually happens.
#
# Worker count: 3 (modest concurrency for a single-host app).
# Threads/worker: 2 (web requests + a couple of API polls in parallel).
# Timeout: 60s (above any reasonable request; below task_time_limit for celery).
command=gunicorn harpoon2.wsgi:application --bind 0.0.0.0:4277 --workers 3 --threads 2 --timeout 60 --access-logfile -
directory=/opt/harpoon2
autostart=true
autorestart=true
startsecs=10
stopwaitsecs=15
stdout_logfile=/var/log/harpoon2/django.log
stderr_logfile=/var/log/harpoon2/django.log
environment=PYTHONUNBUFFERED=1
